name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify release tag matches application version
        shell: pwsh
        run: |
          $sourceVersion = python -c "from orphe_gest.version import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($sourceVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match APP_VERSION $sourceVersion."
          }

      - name: Test update verification
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --clean ORPHE-GEST.spec

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath .\dist\ORPHE-GEST.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath .\dist\ORPHE-GEST.exe.sha256 -Value $digest -NoNewline -Encoding ascii

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath .\dist\ORPHE-GEST.exe -DestinationPath .\dist\ORPHE-GEST.zip -CompressionLevel Optimal

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          .\dist\ORPHE-GEST.exe
          .\dist\ORPHE-GEST.exe.sha256
          .\dist\ORPHE-GEST.zip
          --title "ORPHE-GEST $env:GITHUB_REF_NAME"
          --generate-notes
