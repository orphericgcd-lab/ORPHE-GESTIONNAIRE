name: Build and publish Windows release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify release tag matches application version
        shell: pwsh
        run: |
          $sourceVersion = python -c "from orphe_gest.version import APP_VERSION; print(APP_VERSION)"
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($sourceVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match APP_VERSION $sourceVersion."
          }

      - name: Test update verification
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: python -m PyInstaller --clean ORPHE-GEST.spec

      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $digest = (Get-FileHash -LiteralPath .\dist\ORPHE-GEST.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath .\dist\ORPHE-GEST.exe.sha256 -Value $digest -NoNewline -Encoding ascii

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -LiteralPath .\dist\ORPHE-GEST.exe -DestinationPath .\dist\ORPHE-GEST.zip -CompressionLevel Optimal

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          .\dist\ORPHE-GEST.exe
          .\dist\ORPHE-GEST.exe.sha256
          .\dist\ORPHE-GEST.zip
          --title "ORPHE-GEST $env:GITHUB_REF_NAME"
          --generate-notes

      - name: Update executable in repository files
        shell: pwsh
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          git lfs install --local
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize Git LFS." }

          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the main branch." }

          git checkout --force --no-track -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw "Could not check out the main branch." }

          Copy-Item -LiteralPath .\dist\ORPHE-GEST.exe -Destination .\ORPHE-GEST.exe -Force
          git add -- ORPHE-GEST.exe
          if ($LASTEXITCODE -ne 0) { throw "Could not stage the executable." }

          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "The repository already contains this executable."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) { throw "Could not compare the staged executable." }

          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update downloadable executable for $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw "Could not commit the executable." }

          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Could not push the executable to main." }
